<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Nexora Labs</title>
<meta name="description" content="Log in or create an account to save your Nexora Labs order and track your build.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
<style>
  .auth-wrap{ max-width:440px; margin:0 auto; padding:170px 0 100px; position:relative; }
  .auth-tabs{ display:flex; gap:8px; margin-bottom:26px; background:var(--black-soft); padding:6px; border-radius:12px; border:1px solid var(--line); }
  .auth-tab{ flex:1; text-align:center; padding:10px; border-radius:8px; font-family:var(--font-mono); font-size:13px; cursor:pointer; color:var(--white-faint); transition:all .3s var(--ease); }
  .auth-tab.active-tab{ background:var(--white); color:var(--black); }
  .google-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:13px; border-radius:999px; border:1px solid var(--line-strong);
    background:transparent; color:var(--white); font-family:var(--font-body); font-size:14px; cursor:pointer;
    transition:all .3s var(--ease);
  }
  .google-btn:hover{ border-color:var(--pink); background:var(--pink-dim); }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="brand"><span class="brand-mark"></span>Nexora <small>LABS</small></a>
    <ul class="nav-links">
      <li><a href="index.html" data-nav="index.html">Home</a></li>
      <li><a href="pricing.html" data-nav="pricing.html">Pricing</a></li>
      <li><a href="builder.html" data-nav="builder.html">AI Builder</a></li>
      <li><a href="checkout.html" data-nav="checkout.html">Checkout</a></li>
    </ul>
    <div class="nav-actions">
      <a href="checkout.html" class="cart-btn" aria-label="View cart">🧪<span class="cart-count" data-cart-count style="display:none;">0</span></a>
      <button class="nav-toggle btn btn-outline btn-sm" aria-label="Menu" aria-expanded="false">Menu</button>
    </div>
  </div>
</nav>

<main class="page-fade">
  <div class="orb" aria-hidden="true" style="opacity:.2; top:-100px; right:-260px;"></div>
  <div class="container">
    <div class="auth-wrap">
      <div class="eyebrow" style="justify-content:center;">ACCOUNT ACCESS</div>
      <h2 style="text-align:center; margin-top:14px;">Welcome to the lab.</h2>
      <p style="text-align:center; margin-top:10px;">Log in to save your order and track your build.</p>

      <div class="card" style="margin-top:32px;">
        <div class="auth-tabs">
          <div class="auth-tab active-tab" id="tab-login">Log in</div>
          <div class="auth-tab" id="tab-signup">Sign up</div>
        </div>

        <div class="form-msg" id="auth-msg"></div>

        <button class="google-btn" data-google-signin>
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4c-7.5 0-14 4.2-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.7 35.4 27 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5C9.9 39.7 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.4C41.4 35.9 44 30.5 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
          Continue with Google
        </button>
        <div class="divider-text">or use email</div>

        <form id="form-login">
          <div class="field">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-grad btn-block">Log in</button>
        </form>

        <form id="form-signup" style="display:none;">
          <div class="field">
            <label for="signup-name">Full name</label>
            <input type="text" id="signup-name" required autocomplete="name">
          </div>
          <div class="field">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" required minlength="6" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-grad btn-block">Create account</button>
        </form>
      </div>

      <p style="text-align:center; margin-top:22px; font-size:13px;">By continuing you agree to our <a href="terms.html" style="color:var(--pink);">terms</a> and <a href="privacy.html" style="color:var(--pink);">privacy policy</a>.</p>
    </div>
  </div>
</main>

<!-- Firebase SDKs (compat build — no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
